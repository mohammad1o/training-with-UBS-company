---
grails:
    profile: web
    codegen:
        defaultPackage: university
    gorm:
        reactor:
            # Whether to translate GORM events into Reactor events
            # Disabled by default for performance reasons
            events: false
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
spring:
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'
environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'
    production:
        management:
            endpoints:
                enabled-by-default: false

---
grails:
    mime:
        disable:
            accept:
                header:
                    userAgents:
                        - Gecko
                        - WebKit
                        - Presto
                        - Trident
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8
    views:
        default:
            codec: html
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                expression: html
                scriptlet: html
                taglib: none
                staticparts: none

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.20.112.1:3306/ubs_training
    username: ubs_intern
    password: Admin@11

environments:
    development:
        dataSource:
            dbCreate: update 

    test:
        dataSource:
            dbCreate: update

    production:
        dataSource:
            dbCreate: none
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED


---
# Added by the Spring Security Core plugin:
grails:
    plugin:
        springsecurity:

            logout:
                afterLogoutUrl: '/login/auth'

            userLookup:
                userDomainClassName: 'university.User'
                authorityJoinClassName: 'university.UserRole'

            authority:
                className: 'university.Role'

            controllerAnnotations:
                staticRules:
                    - pattern: /
                      access: ['permitAll']

                    - pattern: /error
                      access: ['permitAll']

                    - pattern: /index
                      access: ['permitAll']

                    - pattern: /index.gsp
                      access: ['permitAll']

                    - pattern: /login/**
                      access: ['permitAll']

                    - pattern: /logout/**
                      access: ['permitAll']

                    - pattern: /assets/**
                      access: ['permitAll']

                    - pattern: /**/js/**
                      access: ['permitAll']

                    - pattern: /**/css/**
                      access: ['permitAll']

                    - pattern: /**/images/**
                      access: ['permitAll']

                    - pattern: /**/favicon.ico
                      access: ['permitAll']

                    - pattern: /**
                      access: ['ROLE_ADMIN', 'ROLE_USER']

            filterChain:
                chainMap:
                    - pattern: /assets/**
                      filters: none

                    - pattern: /**/js/**
                      filters: none

                    - pattern: /**/css/**
                      filters: none

                    - pattern: /**/images/**
                      filters: none

                    - pattern: /**/favicon.ico
                      filters: none

                    - pattern: /**
                      filters: JOINED_FILTERS
